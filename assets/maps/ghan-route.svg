<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" class="vector-map ghan-route-svg">
  <defs>
    <linearGradient id="desertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#15803D" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#C2410C" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#EA580C" stop-opacity="0.3"/>
      <stop offset="90%" stop-color="#1E40AF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="700" rx="16" fill="var(--card-bg, #1E293B)"/>
  <rect width="400" height="700" rx="16" fill="url(#desertGrad)"/>

  <!-- Regional Labels & Topography -->
  <g opacity="0.4" font-size="11" font-weight="700" fill="var(--text-muted, #94A3B8)" letter-spacing="1.5">
    <text x="280" y="80">TIMOR SEA</text>
    <text x="50" y="140">TOP END TROPICS</text>
    <text x="50" y="320">THE RED CENTRE</text>
    <text x="240" y="440">SIMPSON DESERT</text>
    <text x="60" y="560">FLINDERS RANGES</text>
    <text x="280" y="650">SPENCER GULF</text>
  </g>

  <!-- State Border Line (SA / NT) -->
  <line x1="40" y1="400" x2="360" y2="400" stroke="#F59E0B" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.6"/>
  <text x="50" y="394" fill="#F59E0B" font-size="10" font-weight="700" opacity="0.8">SA / NT BORDER (26°S)</text>

  <!-- The Ghan Track Line -->
  <!-- Main Line Shadow -->
  <path d="M 210 640 L 190 560 L 160 520 L 170 450 L 185 340 L 190 260 L 195 180 L 190 70" 
        fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Main Rail Line (Glowing Ochre) -->
  <path id="ghanTrackPath" d="M 210 640 L 190 560 L 160 520 L 170 450 L 185 340 L 190 260 L 195 180 L 190 70" 
        fill="none" stroke="#C85A32" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dashed Center Rail Stitch -->
  <path d="M 210 640 L 190 560 L 160 520 L 170 450 L 185 340 L 190 260 L 195 180 L 190 70" 
        fill="none" stroke="#FEF3C7" stroke-dasharray="6 8" stroke-width="1.5" opacity="0.9"/>

  <!-- Key Route Nodes -->
  <!-- Darwin (KM 2,979) -->
  <g class="map-node" data-stop="darwin" transform="translate(190, 70)">
    <circle r="14" fill="#3B82F6" opacity="0.2"/>
    <circle r="7" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
    <text x="18" y="4" font-size="12" font-weight="700" fill="var(--text-main, #FFFFFF)">Darwin (KM 2,979)</text>
    <text x="18" y="18" font-size="9" fill="var(--text-muted, #94A3B8)">Top End Terminus</text>
  </g>

  <!-- Katherine (KM 2,665) -->
  <g class="map-node" data-stop="katherine" transform="translate(195, 180)">
    <circle r="12" fill="#10B981" opacity="0.2"/>
    <circle r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="4" font-size="11" font-weight="700" fill="var(--text-main, #FFFFFF)">Katherine (KM 2,665)</text>
    <text x="16" y="17" font-size="9" fill="var(--text-muted, #94A3B8)">Nitmiluk Gorge Cruise</text>
  </g>

  <!-- Tennant Creek (KM 2,050) -->
  <g class="map-node" data-stop="tennant" transform="translate(190, 260)">
    <circle r="4" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="14" y="4" font-size="10" font-weight="600" fill="var(--text-main, #E2E8F0)">Tennant Creek (KM 2,050)</text>
  </g>

  <!-- Alice Springs (KM 1,555) -->
  <g class="map-node" data-stop="alice" transform="translate(185, 340)">
    <circle r="16" fill="#EF4444" opacity="0.25" filter="url(#glow)"/>
    <circle r="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="20" y="4" font-size="13" font-weight="800" fill="#F87171">Alice Springs (KM 1,555)</text>
    <text x="20" y="18" font-size="9" fill="var(--text-muted, #CBD5E1)">Red Centre • Major Stop & BBQ</text>
  </g>

  <!-- Marla (KM 1,060) -->
  <g class="map-node" data-stop="marla" transform="translate(170, 450)">
    <circle r="6" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
    <text x="16" y="4" font-size="11" font-weight="700" fill="var(--text-main, #FFFFFF)">Marla (KM 1,060)</text>
    <text x="16" y="17" font-size="9" fill="var(--text-muted, #94A3B8)">Outback Sunrise Experience</text>
  </g>

  <!-- Pimba / Woomera (KM 490) -->
  <g class="map-node" data-stop="pimba" transform="translate(160, 520)">
    <circle r="4" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="-12" y="4" text-anchor="end" font-size="10" font-weight="600" fill="var(--text-main, #E2E8F0)">Pimba (KM 490)</text>
  </g>

  <!-- Port Augusta (KM 315) -->
  <g class="map-node" data-stop="augusta" transform="translate(190, 560)">
    <circle r="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="14" y="4" font-size="10" font-weight="700" fill="var(--text-main, #FFFFFF)">Port Augusta (KM 315)</text>
    <text x="14" y="16" font-size="8.5" fill="var(--text-muted, #94A3B8)">Spencer Gulf Gateway</text>
  </g>

  <!-- Adelaide Parklands (KM 0) -->
  <g class="map-node" data-stop="adelaide" transform="translate(210, 640)">
    <circle r="14" fill="#8B5CF6" opacity="0.2"/>
    <circle r="7" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
    <text x="18" y="4" font-size="12" font-weight="700" fill="var(--text-main, #FFFFFF)">Adelaide (KM 0)</text>
    <text x="18" y="18" font-size="9" fill="var(--text-muted, #94A3B8)">Departure Terminal</text>
  </g>
</svg>