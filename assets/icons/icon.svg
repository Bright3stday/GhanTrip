<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9531E" />
      <stop offset="50%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <!-- Outback Sun -->
  <circle cx="256" cy="220" r="120" fill="url(#sunGrad)" opacity="0.9"/>
  <!-- Desert Dunes / Red Centre Ridges -->
  <path d="M0 380 Q 140 320 280 370 T 512 340 L 512 512 L 0 512 Z" fill="#9A3412" opacity="0.8"/>
  <path d="M0 410 Q 180 370 340 430 T 512 400 L 512 512 L 0 512 Z" fill="#431407"/>
  <!-- The Ghan Train Silhouette -->
  <g transform="translate(136, 210) scale(0.48)">
    <rect x="20" y="160" width="460" height="140" rx="24" fill="#F8FAFC"/>
    <rect x="20" y="240" width="460" height="40" fill="#C85A32"/>
    <!-- Locomotive front shape -->
    <path d="M420 160 Q 480 180 480 240 L 480 300 L 420 300 Z" fill="#F8FAFC"/>
    <!-- Windows -->
    <rect x="60" y="185" width="60" height="40" rx="8" fill="#0F172A"/>
    <rect x="140" y="185" width="60" height="40" rx="8" fill="#0F172A"/>
    <rect x="220" y="185" width="60" height="40" rx="8" fill="#0F172A"/>
    <rect x="300" y="185" width="60" height="40" rx="8" fill="#0F172A"/>
    <path d="M380 185 L 430 185 Q 450 200 450 225 L 380 225 Z" fill="#0F172A"/>
    <!-- Headlight beam -->
    <polygon points="480,240 540,200 540,300" fill="#FEF08A" opacity="0.6"/>
    <!-- Wheels and track -->
    <circle cx="80" cy="300" r="26" fill="#1E293B"/>
    <circle cx="140" cy="300" r="26" fill="#1E293B"/>
    <circle cx="360" cy="300" r="26" fill="#1E293B"/>
    <circle cx="420" cy="300" r="26" fill="#1E293B"/>
    <rect x="0" y="325" width="500" height="12" rx="6" fill="#94A3B8"/>
  </g>
  <!-- Text Label -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#FEF3C7" letter-spacing="3">AUS EXPLORER</text>
</svg>